name: SDK

# Keeps @hackpsu/api-client in lockstep with the API.
#
# On every push to main the OpenAPI document is regenerated from the NestJS app.
# If it changed, the client is regenerated, both packages are version-bumped and
# published, and the refreshed artifacts are committed back. The previous SDK
# died because this step did not exist: entities kept changing and npm never saw
# a new version.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/generate-openapi.ts"
      - "packages/**"
      - ".github/workflows/sdk.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/generate-openapi.ts"
      - "packages/**"
      - ".github/workflows/sdk.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish even if the spec is unchanged"
        type: boolean
        default: false

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Generate, build and verify
    runs-on: ubuntu-latest
    outputs:
      spec-changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install API dependencies
        run: yarn install --frozen-lockfile

      - name: Regenerate the OpenAPI document
        run: yarn openapi

      - name: Detect spec drift
        id: diff
        run: |
          if git diff --quiet -- openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "OpenAPI document unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "OpenAPI document changed:"
            git diff --stat -- openapi.json
          fi

      - name: Install package dependencies
        working-directory: packages
        run: yarn install --frozen-lockfile

      - name: Regenerate the typed client
        working-directory: packages
        run: yarn generate

      - name: Fail if generated client is stale
        run: |
          if ! git diff --quiet -- packages/api-client/src/generated; then
            echo "::error::packages/api-client/src/generated is out of date."
            echo "Run 'yarn openapi && (cd packages && yarn generate)' and commit the result."
            git diff --stat -- packages/api-client/src/generated
            exit 1
          fi

      # Builds first: react-sdk type-checks against api-client's emitted
      # declarations, so a bare typecheck would fail on a clean checkout.
      - name: Build, type-check and test packages
        working-directory: packages
        run: yarn verify

      - name: Upload spec artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

  publish:
    name: Publish to npm
    needs: build
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' && needs.build.outputs.spec-changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets npm mint a short-lived OIDC credential. Harmless when NPM_TOKEN is
      # used instead, and required once trusted publishing is configured on
      # npmjs.com. See packages/README.md for the switch-over steps.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.SDK_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: yarn
          cache-dependency-path: yarn.lock

      # Trusted publishing needs npm 11.5.1 or newer, which is ahead of what
      # some Node 24 images bundle.
      - name: Ensure a recent npm
        run: npm install -g npm@latest

      - name: Install API dependencies
        run: yarn install --frozen-lockfile

      - name: Regenerate spec and client
        run: |
          yarn openapi
          cd packages
          yarn install --frozen-lockfile
          yarn generate

      - name: Bump versions
        id: version
        working-directory: packages
        run: |
          NEXT=$(node -p "
            const v = require('./api-client/package.json').version.split('.');
            v[2] = Number(v[2]) + 1;
            v.join('.')
          ")
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

          # Both packages move together, and react-sdk pins the exact client
          # version so a consumer can never mix a new SDK with an old client.
          node -e "
            const fs = require('fs');
            for (const p of ['api-client', 'react-sdk']) {
              const file = p + '/package.json';
              const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
              pkg.version = '$NEXT';
              if (pkg.dependencies?.['@hackpsu/api-client']) {
                pkg.dependencies['@hackpsu/api-client'] = '$NEXT';
              }
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
            }
          "

      - name: Build
        working-directory: packages
        run: yarn build

      - name: Publish @hackpsu/api-client
        working-directory: packages/api-client
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @hackpsu/react-sdk
        working-directory: packages/react-sdk
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json packages/api-client/src/generated \
            packages/api-client/package.json packages/react-sdk/package.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(sdk): release v${{ steps.version.outputs.version }} [skip ci]"
            git push
          fi
